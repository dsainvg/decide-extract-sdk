[package]
name = "dexa-ai-sdk"
version = "0.5.0"
edition = "2021"
description = "Rust SDK for dexa-ai-sdk generated by Fern"
license = "Apache-2.0"
repository = "https://github.com/dsainvg/decide-extract-sdk"
documentation = "https://github.com/dsainvg/decide-extract-sdk/tree/main/packages/sdk-rust"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

