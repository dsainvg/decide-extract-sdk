openapi: 3.1.0
info:
  title: Decider-Extractor API
  description: Minimal OpenAI-compatible, non-streaming API for decider/extractor tasks (TypeSafe-style). Supports combined /v1/tasks and individual /decide and /extract endpoints. Designed to extend to multimodal inputs (image/audio) later and multi-language targets.
  version: 0.5.0
servers:
  - url: http://localhost:8080
tags:
  - name: Tasks
paths:
  /v1/tasks:
    post:
      tags: [Tasks]
      operationId: runTasks
      summary: Run multiple decider and extractor tasks in a single request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTasksRequest'
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/RunTasksResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /v1/decide-extract:
    post:
      tags: [Tasks]
      operationId: decideExtract
      summary: Backward-compatible alias of /v1/tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunTasksRequest'
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/RunTasksResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /decide:
    post:
      tags: [Tasks]
      operationId: decide
      summary: Run a single decider task (TypeSafe-style)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/DecideResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /extract:
    post:
      tags: [Tasks]
      operationId: extract
      summary: Run a single extractor task (TypeSafe-style)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

components:
  schemas:
    RunTasksRequest:
      type: object
      required: [model, tasks]
      additionalProperties: false
      properties:
        model: { type: string }
        context: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageInput' }
        audio:
          type: array
          items: { $ref: '#/components/schemas/AudioInput' }
        tasks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Task' }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0 }
        max_output_tokens: { type: integer, minimum: 1, maximum: 4096, default: 16 }
        response_format:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [json_object], default: json_object }
        target_language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
          description: Preferred output language for results
        output_language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
          description: Alias for target_language
      oneOf:
        - required: [context]
        - required: [messages]

    DecideRequest:
      type: object
      required: [model, question]
      additionalProperties: false
      properties:
        model: { type: string }
        context: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageInput' }
        audio:
          type: array
          items: { $ref: '#/components/schemas/AudioInput' }
        question: { type: string }
        choices: { type: array, items: { type: string }, minItems: 1 }
        options: { type: array, items: { type: string }, minItems: 1 }
        instruction: { type: string }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0 }
        max_output_tokens: { type: integer, minimum: 1, maximum: 4096, default: 16 }
        response_format:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [json_object], default: json_object }
        target_language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
        output_language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
      oneOf:
        - required: [context]
        - required: [messages]

    ExtractRequest:
      type: object
      required: [model, instruction]
      additionalProperties: false
      properties:
        model: { type: string }
        context: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageInput' }
        audio:
          type: array
          items: { $ref: '#/components/schemas/AudioInput' }
        instruction: { type: string }
        fields: { type: array, items: { type: string }, minItems: 1 }
        keys: { type: array, items: { type: string }, minItems: 1 }
        schema: { type: object, additionalProperties: true }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0 }
        max_output_tokens: { type: integer, minimum: 1, maximum: 4096, default: 16 }
        response_format:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [json_object], default: json_object }
        target_language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
        output_language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
      oneOf:
        - required: [context]
        - required: [messages]

    Message:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content:
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ContentPart' }
        language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]

    ContentPart:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [text, image_url, image, audio, input_audio] }
        text: { type: string }
        language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]
        image_url: { $ref: '#/components/schemas/ImageUrl' }
        image: { $ref: '#/components/schemas/ImageInput' }
        audio: { $ref: '#/components/schemas/AudioInput' }
        input_audio: { $ref: '#/components/schemas/AudioInput' }

    ImageUrl:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string }
        detail: { type: string, enum: [low, high, auto], default: auto }

    ImageInput:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [url, base64] }
        url: { type: string }
        data: { type: string, description: base64-encoded image }
        mime_type: { type: string, description: image/png, image/jpeg, image/webp, image/gif }

    AudioInput:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [url, base64] }
        url: { type: string }
        data: { type: string, description: base64-encoded audio }
        mime_type: { type: string, description: audio/mp3, audio/wav, audio/mpeg, audio/ogg, audio/mp4 }

    Task:
      oneOf:
        - $ref: '#/components/schemas/DecideTask'
        - $ref: '#/components/schemas/ExtractTask'
      discriminator:
        propertyName: type
        mapping:
          decide: '#/components/schemas/DecideTask'
          extract: '#/components/schemas/ExtractTask'

    DecideTask:
      type: object
      required: [type, name, question]
      additionalProperties: false
      properties:
        type: { type: string, enum: [decide] }
        name: { type: string, pattern: '^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,63}$' }
        id: { type: string, pattern: '^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,63}$' }
        question: { type: string }
        choices: { type: array, items: { type: string }, minItems: 1 }
        options: { type: array, items: { type: string }, minItems: 1 }
        instruction: { type: string }
        target_language: { type: string, enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs] }

    ExtractTask:
      type: object
      required: [type, name, instruction]
      additionalProperties: false
      properties:
        type: { type: string, enum: [extract] }
        name: { type: string, pattern: '^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,63}$' }
        id: { type: string, pattern: '^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,63}$' }
        instruction: { type: string }
        fields: { type: array, items: { type: string }, minItems: 1 }
        keys: { type: array, items: { type: string }, minItems: 1 }
        schema: { type: object, additionalProperties: true }
        target_language: { type: string, enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs] }

    RunTasksResponse:
      type: object
      required: [id, model, choices, results, usage]
      additionalProperties: false
      properties:
        id: { type: string }
        model: { type: string }
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/Choice' }
        results: { type: object, additionalProperties: true }
        tasks: { type: object, additionalProperties: true, description: Backward-compatible alias for results }
        usage: { $ref: '#/components/schemas/Usage' }

    DecideResponse:
      type: object
      required: [id, model, choices, result, usage]
      additionalProperties: false
      properties:
        id: { type: string }
        model: { type: string }
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/Choice' }
        result: { $ref: '#/components/schemas/DecideResult' }
        decision: { $ref: '#/components/schemas/DecideResult' }
        value: { type: string }
        usage: { $ref: '#/components/schemas/Usage' }

    ExtractResponse:
      type: object
      required: [id, model, choices, result, usage]
      additionalProperties: false
      properties:
        id: { type: string }
        model: { type: string }
        choices:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/Choice' }
        result: { type: object, additionalProperties: true }
        data: { type: object, additionalProperties: true, description: Backward-compatible alias for result }
        usage: { $ref: '#/components/schemas/Usage' }

    Choice:
      type: object
      required: [message, finish_reason]
      additionalProperties: false
      properties:
        message: { $ref: '#/components/schemas/ResponseMessage' }
        finish_reason: { type: string, enum: [stop, length, content_filter], default: stop }

    ResponseMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role: { type: string, enum: [assistant] }
        content: { type: string }
        language:
          type: string
          enum: [en, es, fr, de, it, pt, nl, ru, ja, ko, zh, ar, hi, tr, pl, sv, da, no, fi, cs]

    DecideResult:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: string }
        reason: { type: string }

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      additionalProperties: false
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [type, message]
          additionalProperties: false
          properties:
            type: { type: string }
            message: { type: string }
            param: { type: string }
            code: { type: string }
