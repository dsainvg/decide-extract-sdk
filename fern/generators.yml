# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
#
# Fern generator configuration.
#   Source of truth:  openapi/openapi.yml  (contract-first)
#   Released version: info.version in that spec (see scripts/generate.mjs)
#   Outputs:          ../packages/sdk-*   (committed to git)
#
# Generation requires Docker: `npm run fern:generate` from the repo root.
#
# C++ has no Fern generator (not published in the generator registry), so there is
# no sdk-cpp target here. See docs/api-reference/clients.md for how to consume the
# contract from C++ directly.
#
# Package naming for the non-JavaScript registries (gem, crate, Maven, NuGet) uses
# the generator defaults until each is given a name in your registry, see
# PUBLISHING.md.
api:
  specs:
    - openapi: openapi/openapi.yml

default-group: sdk
groups:
  sdk:
    generators:
      - name: fern-typescript-sdk
        version: 3.105.1
        output:
          location: local-file-system
          path: ../packages/sdk-ts
        config:
          packageName: "@dsainvg/decide-extractor-sdk"

      - name: fern-python-sdk
        version: 5.41.0
        output:
          location: local-file-system
          path: ../packages/sdk-py
        config:
          package_name: "dsainvg_decide_extractor_sdk"

      - name: fern-ruby-sdk
        version: 1.38.1
        output:
          location: local-file-system
          path: ../packages/sdk-ruby

      - name: fern-rust-sdk
        version: 0.53.1
        output:
          location: local-file-system
          path: ../packages/sdk-rust

      - name: fern-java-sdk
        version: 4.32.0
        output:
          location: local-file-system
          path: ../packages/sdk-java

      - name: fern-csharp-sdk
        version: 2.92.1
        output:
          location: local-file-system
          path: ../packages/sdk-csharp