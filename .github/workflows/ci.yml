name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate OpenAPI contract and Fern config
        run: npm run fern:check

  generate:
    name: Generate SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Regenerate SDKs from the contract
        run: npm run fern:generate
      - name: Fail if committed SDKs drifted from the contract
        run: npm run fern:check:drift
      - uses: actions/upload-artifact@v4
        with:
          name: generated-sdks
          path: packages/
          if-no-files-found: error

  typescript:
    name: TypeScript SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages
      - run: npm ci
      - name: Build and test
        run: npm run test:ts

  python:
    name: Python SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Build and test
        run: npm run test:py

  ruby:
    name: Ruby SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: npm ci
      - name: Build and test
        run: npm run test:rb

  rust:
    name: Rust SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sdk-rust
      - run: npm ci
      - name: Build and test
        run: npm run test:rs

  java:
    name: Java SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: npm ci
      - name: Build and test
        run: npm run test:java

  dotnet:
    name: .NET SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - name: Build and test
        run: npm run test:cs

  docs:
    name: Docs site
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build docs site
        run: npm run docs:build
      - name: Fail on broken links
        run: node scripts/check-docs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: sites/
          retention-days: 7