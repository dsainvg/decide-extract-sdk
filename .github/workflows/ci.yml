name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate OpenAPI contract and Fern config
        run: npm run fern:check

  generate:
    name: Generate SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Regenerate SDKs from the contract
        run: npm run fern:generate
      - name: Fail if committed SDKs drifted from the contract
        run: npm run fern:check:drift
      - uses: actions/upload-artifact@v4
        with:
          name: generated-sdks
          path: packages/
          if-no-files-found: error

  typescript:
    name: TypeScript SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdks
          path: packages
      - run: npm ci
      - name: Build and test
        run: npm run test:ts

  python:
    name: Python SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - name: Build and test
        run: npm run test:py

  ruby:
    name: Ruby SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - run: npm ci
      - name: Build and test
        run: npm run test:rb

  rust:
    name: Rust SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sdk-rust
      - run: npm ci
      - name: Build and test
        run: npm run test:rs

  java:
    name: Java SDK
    needs: generate
    runs-on: ubuntu-latest
    # Only this job writes, and only to publish the build log it produced.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Build and test
        run: |
          (cd packages/sdk-java && mvn -B verify) 2>&1 | tee "$GITHUB_WORKSPACE/fern/java-build.log" || \
            echo "Java build failed, the log is committed to diagnostics/java-build"
          exit "${PIPESTATUS[0]}"
      - name: Publish the build log
        if: always()
        run: |
          # Pushed as a standalone repository, the way the regeneration log is,
          # because a failed job's log cannot otherwise be read here.
          rm -rf .log-push
          mkdir -p .log-push/fern
          cp "$GITHUB_WORKSPACE/fern/java-build.log" .log-push/fern/ || exit 0
          cd .log-push
          git init -q
          git checkout -q -b diagnostics/java-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --force
          git commit -q -m "ci: record the Java build output"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            diagnostics/java-build
          echo "pushed diagnostics/java-build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet:
    name: .NET SDK
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated-sdks
          path: packages
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - name: Build and test
        run: npm run test:cs

  docs:
    name: Docs site
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build docs site
        run: npm run docs:build
      - name: Fail on broken links
        run: node scripts/check-docs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: sites/
          retention-days: 7