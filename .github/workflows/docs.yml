name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run docs:build
      - name: Check links, front matter and version
        run: node scripts/check-docs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sites
          path: sites/
          retention-days: 7

  publish-branch:
    name: Publish to the sites branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sites
          path: sites
      - name: Push the built site to the sites branch
        run: |
          set -euo pipefail
          cd sites
          git init -q
          git checkout -q -b sites
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            sites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}